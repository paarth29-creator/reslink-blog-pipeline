name: Check Search Console

# Manual trigger only, this never runs on a schedule and never touches
# the blog publishing pipeline. Trigger it from the Actions tab in
# GitHub whenever you want to see current Search Console numbers in
# the log.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Search Console check
        env:
          GSC_SERVICE_ACCOUNT_KEY: ${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          mkdir -p reports
          node scripts/check-search-console.js > reports/gsc-latest.txt

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/gsc-latest.txt
          git diff --staged --quiet || git commit -m "Update GSC report $(date -u +%Y-%m-%d)"
          git push
